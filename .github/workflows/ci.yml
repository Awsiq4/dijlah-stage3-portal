name: CI
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Structure and navigation checks
        run: npm run verify
      - name: Schedule checks (36 slots)
        run: npm run verify:schedule
      - name: Schedule vs reference JSON (36 blocks / 76 periods)
        run: npm run verify:schedule:json
      - name: Unit tests (mergeById)
        run: npm test
      - name: Support integration tests (isolated in-memory PostgreSQL)
        run: node --experimental-strip-types scripts/support-live-test.mjs --memory
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
